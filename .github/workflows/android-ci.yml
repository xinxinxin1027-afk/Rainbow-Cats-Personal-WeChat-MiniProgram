name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'miniprogram/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'miniprogram/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: 纯源码结构检查
        run: python3 tool/static_source_check.py
      - name: 构建工具自检
        run: python3 tool/test_tooling.py
      - name: 准备 Android 工程和原始资源
        run: bash tool/bootstrap_android.sh
      - name: 检查格式
        run: dart format --output=none lib test integration_test
      - name: 静态分析
        run: flutter analyze --fatal-infos
      - name: Store 与核心业务测试
        id: store_tests
        continue-on-error: true
        run: flutter test test/store_test.dart --reporter expanded
      - name: WebDAV 与 Server 接口测试
        id: webdav_tests
        continue-on-error: true
        run: flutter test test/webdav_test.dart --reporter expanded
      - name: 页面与交互 Widget 测试
        id: widget_tests
        continue-on-error: true
        run: flutter test test/app_widget_test.dart --reporter expanded
      - name: 多尺寸布局碰撞测试
        id: layout_tests
        continue-on-error: true
        run: flutter test test/layout_collision_test.dart --reporter expanded
      - name: 自动测试总门禁
        if: always()
        env:
          STORE_TESTS: ${{ steps.store_tests.outcome }}
          WEBDAV_TESTS: ${{ steps.webdav_tests.outcome }}
          WIDGET_TESTS: ${{ steps.widget_tests.outcome }}
          LAYOUT_TESTS: ${{ steps.layout_tests.outcome }}
        run: |
          printf 'store=%s\nwebdav=%s\nwidget=%s\nlayout=%s\n' "$STORE_TESTS" "$WEBDAV_TESTS" "$WIDGET_TESTS" "$LAYOUT_TESTS"
          test "$STORE_TESTS" = success
          test "$WEBDAV_TESTS" = success
          test "$WIDGET_TESTS" = success
          test "$LAYOUT_TESTS" = success
      - name: 构建 Debug APK
        run: flutter build apk --debug
      - name: 构建 Release APK
        run: flutter build apk --release
      - name: 验证 APK 结构和签名
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | tee build/apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee build/apk-signature.txt
          sha256sum "$APK" | tee build/app-release.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: rainbow-cats-ci-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/apk-badging.txt
            app/build/apk-signature.txt
            app/build/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
