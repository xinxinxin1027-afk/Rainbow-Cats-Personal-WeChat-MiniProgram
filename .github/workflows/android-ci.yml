name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'miniprogram/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'miniprogram/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: 纯源码结构检查
        run: python3 tool/static_source_check.py
      - name: 构建工具自检
        run: python3 tool/test_tooling.py
      - name: 准备 Android 工程和原始资源
        run: bash tool/bootstrap_android.sh
      - name: 检查格式
        run: dart format --output=none lib test integration_test
      - name: 静态分析
        run: flutter analyze --fatal-infos
      - name: Store 与核心业务测试
        run: flutter test test/store_test.dart --reporter expanded
      - name: WebDAV 与 Server 接口测试
        run: flutter test test/webdav_test.dart --reporter expanded
      - name: Widget 双人、玻璃 UI、任务、商城与图片回归
        run: flutter test test/app_widget_test.dart --reporter expanded
      - name: 双人身份切换且无成员管理
        run: flutter test test/dual_identity_test.dart --reporter expanded

      - name: 按钮矩阵 · 首页导航与图片
        timeout-minutes: 3
        run: flutter test test/button_matrix_test.dart --reporter expanded --plain-name '按钮矩阵：首页导航、统计入口与三张图片编辑'
      - name: 按钮矩阵 · 任务全操作
        timeout-minutes: 3
        run: flutter test test/button_matrix_test.dart --reporter expanded --plain-name '按钮矩阵：任务新增、滑杆、星标、编辑、完成和删除'
      - name: 按钮矩阵 · 商城全操作
        timeout-minutes: 3
        run: flutter test test/button_matrix_test.dart --reporter expanded --plain-name '按钮矩阵：商城新增、图片、滑杆、星标、编辑、兑换和删除'
      - name: 按钮矩阵 · 双方头像与仓库入口
        timeout-minutes: 3
        run: flutter test test/button_matrix_test.dart --reporter expanded --plain-name '按钮矩阵：双方头像、仓库图片、筛选、积分与设置入口'
      - name: 按钮矩阵 · 仓库物品全操作
        timeout-minutes: 3
        run: flutter test test/button_matrix_test.dart --reporter expanded --plain-name '按钮矩阵：仓库物品图片、使用取消/确认和删除'
      - name: 按钮矩阵 · 设置全部操作
        timeout-minutes: 3
        run: flutter test test/button_matrix_test.dart --reporter expanded --plain-name '按钮矩阵：设置页全部本地和无配置网络操作'
      - name: 按钮矩阵 · 左滑动作
        timeout-minutes: 3
        run: flutter test test/button_matrix_test.dart --reporter expanded --plain-name '按钮矩阵：左滑星标和删除动作'

      - name: 55 个多尺寸布局碰撞测试
        shell: bash
        run: |
          set +e
          flutter test test/layout_collision_test.dart --reporter expanded > /tmp/layout.log 2>&1
          status=$?
          cat /tmp/layout.log
          if [ "$status" -ne 0 ]; then
            diagnostic=$(tail -c 7000 /tmp/layout.log | base64 -w0)
            echo "::error file=test/layout_collision_test.dart,title=layout_failure_base64::$diagnostic"
          fi
          exit "$status"
      - name: 构建 Debug APK
        run: flutter build apk --debug
      - name: 构建 Release APK
        run: flutter build apk --release
      - name: 验证 APK 结构和签名
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | tee build/apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee build/apk-signature.txt
          sha256sum "$APK" | tee build/app-release.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: rainbow-cats-ci-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/apk-badging.txt
            app/build/apk-signature.txt
            app/build/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
