name: Android Delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-delivery.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签，例如 v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  actions: read
  contents: write

env:
  FLUTTER_VERSION: '3.44.9'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v1.0.0' }}
  RAINBOW_KEYSTORE_BASE64: ${{ secrets.RAINBOW_KEYSTORE_BASE64 }}
  RAINBOW_KEYSTORE_PASSWORD: ${{ secrets.RAINBOW_KEYSTORE_PASSWORD }}
  RAINBOW_KEY_ALIAS: ${{ secrets.RAINBOW_KEY_ALIAS }}
  RAINBOW_KEY_PASSWORD: ${{ secrets.RAINBOW_KEY_PASSWORD }}

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 纯源码结构检查
        id: source
        run: python3 tool/static_source_check.py
      - name: 构建工具自检
        id: tooling
        run: python3 tool/test_tooling.py
      - name: 准备 Android 工程和签名
        id: prepare
        run: |
          bash tool/bootstrap_android.sh
          bash tool/prepare_signing.sh
      - name: Dart 格式门禁
        id: format
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Flutter 静态分析
        id: analyze
        run: flutter analyze --fatal-infos
      - name: Store / WebDAV / Widget / 48布局测试
        id: tests
        run: |
          flutter test test/store_test.dart --reporter compact
          flutter test test/webdav_test.dart --reporter compact
          flutter test test/app_widget_test.dart --reporter compact
          flutter test test/layout_collision_test.dart --reporter compact
      - name: 构建 Debug APK
        id: debug
        run: flutter build apk --debug
      - name: 构建最终 Release APK 与分架构 APK
        id: release_build
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - name: 校验最终 APK 包结构、签名和 SHA-256
        id: apk_verify
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | tee build/apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee build/apk-signature.txt
          sha256sum "$APK" | tee build/app-release.apk.sha256

      - name: 生成 Golden 与静态视觉检查稿
        id: golden
        run: |
          flutter test --update-goldens test/visual_review_test.dart
          python3 -m pip install --disable-pip-version-check pillow
          python3 tool/build_static_visual_review.py
      - name: 启用 KVM
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .
      - name: Pixel 6 API 35 安装最终 APK、启动、点击、截图与 Integration Test
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd app
            bash tool/verify_release_apk.sh build/app/outputs/flutter-apk/app-release.apk
            bash tool/run_android_visual_review.sh
            flutter test integration_test/app_flow_test.dart -d emulator-5554
      - name: 原版截图与 Emulator 截图对照稿
        id: comparison
        run: python3 tool/build_visual_comparison.py

      - name: 整理经过验证的发布文件
        id: package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../release
          mkdir -p ../release
          cp build/app/outputs/flutter-apk/app-release.apk ../release/rainbow-cats-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../release/rainbow-cats-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../release/rainbow-cats-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ../release/rainbow-cats-android-x86_64.apk
          cp build/apk-badging.txt build/apk-signature.txt ../release/
          cp ../FINAL_REPORT.md ../RELEASE_NOTES.md ../release/
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "actions_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "flutter_version=${FLUTTER_VERSION}"
            echo "emulator=Pixel_6_API_35"
            echo "source_check=PASS"
            echo "format=PASS"
            echo "analyze=PASS"
            echo "store_webdav_widget_layout=PASS"
            echo "debug_apk=PASS"
            echo "release_apk=PASS"
            echo "aapt_apksigner=PASS"
            echo "golden=PASS"
            echo "release_apk_install_launch=PASS"
            echo "integration=PASS"
            echo "visual_review=PASS"
          } > ../release/RELEASE_VALIDATION.txt
          (cd visual_review && zip -qr ../release/visual-review.zip goldens emulator comparison release 2>/dev/null || zip -qr ../release/visual-review.zip .)
          (cd ../release && sha256sum *.apk > SHA256SUMS.txt)

      - name: 上传 Actions 交付产物
        uses: actions/upload-artifact@v7
        with:
          name: rainbow-cats-delivery-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 90

      - name: 创建或更新 GitHub Release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "Rainbow Cats $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md
          fi
          gh release view "$RELEASE_TAG" --json url,tagName,targetCommitish,assets > release/GITHUB_RELEASE.json

      - name: 将真实 Release 验证写回 FINAL_REPORT
        id: final_report
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          release_url=$(gh release view "$RELEASE_TAG" --json url --jq .url)
          apk_sha=$(sha256sum release/rainbow-cats-android-universal.apk | cut -d' ' -f1)
          cat >> FINAL_REPORT.md <<EOF

          ## 最终自动交付验证（GitHub Actions 实测）

          - Release：$RELEASE_TAG
          - Release URL：$release_url
          - APK 源码 Commit：$GITHUB_SHA
          - Actions Run：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Flutter：$FLUTTER_VERSION
          - Pixel 6 / Android API 35 安装与启动：✅
          - 四个主入口与 Integration Test：✅
          - Store / WebDAV / Widget / 48 组响应式布局：✅
          - Golden / Emulator / 原版截图视觉检查产物：✅
          - Release APK SHA-256：$apk_sha
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FINAL_REPORT.md
          git commit -m "docs: record verified Android v1.0.0 delivery" || true
          git push origin HEAD:main

      - name: 失败时记录精简门禁状态
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.source.outcome }}
          TOOLING: ${{ steps.tooling.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          DEBUG: ${{ steps.debug.outcome }}
          RELEASE_BUILD: ${{ steps.release_build.outcome }}
          APK_VERIFY: ${{ steps.apk_verify.outcome }}
          GOLDEN: ${{ steps.golden.outcome }}
          KVM: ${{ steps.kvm.outcome }}
          EMULATOR: ${{ steps.emulator.outcome }}
          COMPARISON: ${{ steps.comparison.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          GITHUB_RELEASE: ${{ steps.github_release.outcome }}
        working-directory: .
        shell: bash
        run: |
          cat > docs/DELIVERY_FAILURE.txt <<EOF
          run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          head_sha=$GITHUB_SHA
          source=$SOURCE
          tooling=$TOOLING
          prepare=$PREPARE
          format=$FORMAT
          analyze=$ANALYZE
          tests=$TESTS
          debug_apk=$DEBUG
          release_build=$RELEASE_BUILD
          apk_verify=$APK_VERIFY
          golden=$GOLDEN
          kvm=$KVM
          emulator=$EMULATOR
          comparison=$COMPARISON
          package=$PACKAGE
          github_release=$GITHUB_RELEASE
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DELIVERY_FAILURE.txt
          git commit -m "test: record Android delivery failure" || true
          git push origin HEAD:main || true
