name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签，例如 v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 准备 Android 工程和原始资源
        run: bash tool/bootstrap_android.sh
      - run: flutter analyze
      - name: 逻辑与布局测试
        run: flutter test test/store_test.dart test/layout_collision_test.dart
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi
      - name: 整理发布文件
        shell: bash
        run: |
          mkdir -p ../release
          cp build/app/outputs/flutter-apk/app-release.apk ../release/rainbow-cats-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../release/rainbow-cats-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../release/rainbow-cats-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ../release/rainbow-cats-android-x86_64.apk
          cd ../release
          sha256sum *.apk > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.apk
            release/SHA256SUMS.txt
