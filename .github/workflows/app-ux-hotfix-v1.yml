name: Apply v1.0.0 UX Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-ux-hotfix-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply navigation and chrome patch
        run: python3 app/tool/apply_ux_hotfix_v1.py
      - name: Commit source changes and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/tool/apply_ux_hotfix_v1.py .github/workflows/app-ux-hotfix-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m 'fix(app): remove mini-program chrome and preserve Android navigation state'
          git push origin HEAD:main
