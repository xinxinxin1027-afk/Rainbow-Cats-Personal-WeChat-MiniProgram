name: Bootstrap Android Source V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-android-source-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified application source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part01.b64 .bootstrap/part02.b64 .bootstrap/part03a.b64 .bootstrap/part03b.b64 .bootstrap/part04.b64 .bootstrap/part05.b64 .bootstrap/part06a.b64 .bootstrap/part07c1.b64 .bootstrap/part07c2.b64 .bootstrap/part07b.b64 .bootstrap/part08a.b64 .bootstrap/part08b.b64 | base64 -d > /tmp/rainbow-overlay.tar.gz
          echo "60a3e6d95ed62fcccce4cdaf6fe549bf1981e27f55f9de2f02a995cb331074a4  /tmp/rainbow-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rainbow-overlay.tar.gz -C .
          # GitHub Actions' GITHUB_TOKEN may not rewrite workflow files. Keep those
          # untouched here; the authenticated repository connector installs them next.
          git restore --source=HEAD -- .github/workflows
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(android): complete Flutter client, WebDAV and tests"
          git push origin HEAD:main
