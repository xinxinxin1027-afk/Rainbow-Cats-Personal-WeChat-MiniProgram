name: Bootstrap Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate transport chunks
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for f in .bootstrap/part*.b64; do
            printf '%s bytes=' "$f"
            wc -c < "$f"
            if base64 -d "$f" >/dev/null 2>/tmp/b64.err; then
              echo "  base64=OK sha256=$(sha256sum "$f" | cut -d' ' -f1)"
            else
              echo "  base64=FAIL"
              cat /tmp/b64.err
              failed=1
            fi
          done
          exit "$failed"
