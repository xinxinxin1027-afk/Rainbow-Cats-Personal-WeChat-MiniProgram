name: CI Status Mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-status-mirror.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Wait for latest Android CI and mirror result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            json=$(gh run list --workflow 'Android CI' --branch main --limit 1 --json databaseId,status,conclusion,headSha,url)
            run_id=$(echo "$json" | jq -r '.[0].databaseId // empty')
            status=$(echo "$json" | jq -r '.[0].status // empty')
            if [ -n "$run_id" ] && [ "$status" = completed ]; then
              break
            fi
            sleep 20
          done
          json=$(gh run list --workflow 'Android CI' --branch main --limit 1 --json databaseId,status,conclusion,headSha,url)
          run_id=$(echo "$json" | jq -r '.[0].databaseId')
          status=$(echo "$json" | jq -r '.[0].status')
          conclusion=$(echo "$json" | jq -r '.[0].conclusion')
          head_sha=$(echo "$json" | jq -r '.[0].headSha')
          url=$(echo "$json" | jq -r '.[0].url')
          {
            echo "run_id=$run_id"
            echo "head_sha=$head_sha"
            echo "status=$status"
            echo "conclusion=$conclusion"
            echo "url=$url"
            if [ "$conclusion" != success ]; then
              echo 'failed_steps:'
              gh run view "$run_id" --json jobs --jq '.jobs[] | .name as $j | .steps[] | select(.conclusion=="failure") | "- \($j): \(.name)"' || true
              echo 'failed_log_tail:'
              gh run view "$run_id" --log-failed 2>/dev/null | tail -n 35 || true
            fi
          } > docs/ANDROID_CI_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ANDROID_CI_STATUS.txt
          git commit -m "test: mirror Android CI result"
          git push origin HEAD:main
