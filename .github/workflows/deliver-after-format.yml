name: Deliver After Format

on:
  workflow_run:
    workflows: ['Format Android Source']
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch final Android delivery from latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-delivery.yml --repo "$GITHUB_REPOSITORY" -f tag=v1.0.0
