name: Delivery Result

on:
  workflow_run:
    workflows: ['Android Delivery']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Record delivery result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "conclusion=$CONCLUSION"
            echo "run_id=$RUN_ID"
            echo "run_url=$RUN_URL"
            echo "head_sha=$HEAD_SHA"
            if [ "$CONCLUSION" = success ]; then
              gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json url,tagName,targetCommitish --jq '"release_url=\(.url)\ntag=\(.tagName)\ntarget=\(.targetCommitish)"'
            else
              echo 'failed_steps:'
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | .name as $j | .steps[] | select(.conclusion=="failure") | "- \($j): \(.name)"' || true
              echo 'failed_log_tail:'
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null | tail -n 30 || true
            fi
          } > docs/DELIVERY_RESULT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DELIVERY_RESULT.txt
          git commit -m "release: record Android delivery $CONCLUSION"
          git push origin HEAD:main
