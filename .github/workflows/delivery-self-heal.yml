name: Delivery Self Heal

on:
  workflow_run:
    workflows: ['Android Delivery']
    types: [completed]

permissions:
  actions: write
  contents: write

jobs:
  heal:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Inspect failed gate
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          failed=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(" | ")')
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "Failed: $failed"
      - name: Normalize Dart and retry once when format is the only blocker
        if: ${{ contains(steps.inspect.outputs.failed, 'Dart 格式门禁') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/subosito/flutter-action/master/setup.sh >/dev/null || true
          echo 'Formatting is handled by the dedicated Format Android Source workflow.'
          gh workflow run format-android-source.yml --repo "$GITHUB_REPOSITORY" || true
      - name: Retry one transient emulator failure
        if: ${{ contains(steps.inspect.outputs.failed, 'Pixel 6 API 35') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -f docs/EMULATOR_RETRY_USED.txt ]; then
            echo "first_retry_for_run=${{ github.event.workflow_run.id }}" > docs/EMULATOR_RETRY_USED.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/EMULATOR_RETRY_USED.txt
            git commit -m 'test: record one allowed emulator delivery retry'
            git push origin HEAD:main
            gh workflow run android-delivery.yml --repo "$GITHUB_REPOSITORY" -f tag=v1.0.0
          fi
