name: Format Android Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-android-source.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true
      - working-directory: app
        run: dart format lib test integration_test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib app/test app/integration_test
          if git diff --cached --quiet; then
            echo 'No Dart formatting changes required.'
          else
            git commit -m 'style: normalize final Flutter source formatting'
            git push origin HEAD:main
          fi
