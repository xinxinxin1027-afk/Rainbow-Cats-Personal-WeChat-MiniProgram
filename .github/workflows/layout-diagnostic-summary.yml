name: Layout Diagnostic Summary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layout-diagnostic-summary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true
      - name: Prepare
        working-directory: app
        run: bash tool/bootstrap_android.sh
      - name: Capture concise layout failure
        working-directory: app
        shell: bash
        run: |
          set +e
          flutter test test/layout_collision_test.dart --reporter expanded > /tmp/layout.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            { grep -E '\[E\]|EXCEPTION|RenderFlex|overflow|Overflow|Expected:|Actual:|Which:|布局|异常|Test failed' /tmp/layout.log || true; echo '--- tail ---'; tail -n 35 /tmp/layout.log; } | tail -c 6500 > ../docs/LAYOUT_DIAGNOSTIC_SUMMARY.txt
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/LAYOUT_DIAGNOSTIC_SUMMARY.txt
            git commit -m "test: capture concise layout regression summary"
            git push origin HEAD:main
          fi
          exit "$status"
