name: Layout Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layout-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true
      - name: Prepare Android resources
        working-directory: app
        run: bash tool/bootstrap_android.sh
      - name: Run layout suite and persist diagnostic on failure
        shell: bash
        working-directory: app
        run: |
          set +e
          flutter test test/layout_collision_test.dart --reporter expanded > /tmp/layout.log 2>&1
          status=$?
          cat /tmp/layout.log
          if [ "$status" -ne 0 ]; then
            tail -c 24000 /tmp/layout.log > ../docs/LAYOUT_DIAGNOSTIC.log
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/LAYOUT_DIAGNOSTIC.log
            git commit -m "test: capture layout regression diagnostic"
            git push origin HEAD:main
          fi
          exit "$status"
