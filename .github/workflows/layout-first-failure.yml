name: Layout First Failure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layout-first-failure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true
      - working-directory: app
        run: bash tool/bootstrap_android.sh
      - name: Run and capture first failure
        working-directory: app
        shell: bash
        run: |
          set +e
          flutter test test/layout_collision_test.dart --reporter expanded > /tmp/layout.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/layout.log').read_text(errors='replace').splitlines()
          selected = []
          needles = ('[E]', 'RenderFlex', 'overflowed', 'Expected:', 'Actual:', 'Which:', '布局/渲染异常', 'EXCEPTION CAUGHT')
          for line in lines:
              if any(n in line for n in needles):
                  selected.append(line[:500])
              if len(selected) >= 12:
                  break
          Path('../docs/LAYOUT_FAIL.txt').write_text('\n'.join(selected)[:2500] + '\n', encoding='utf-8')
          PY
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/LAYOUT_FAIL.txt
            git commit -m "test: record first layout failure"
            git push origin HEAD:main
          fi
          exit "$status"
