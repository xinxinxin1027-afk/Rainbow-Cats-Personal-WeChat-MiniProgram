name: Layout Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layout-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true
      - working-directory: app
        run: bash tool/bootstrap_android.sh
      - name: Run 48 responsive page checks
        working-directory: app
        shell: bash
        run: |
          set +e
          flutter test test/layout_collision_test.dart --reporter expanded > /tmp/layout.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            printf 'PASS\n48 responsive page/viewport checks passed.\n' > ../docs/LAYOUT_PROOF.txt
          else
            { printf 'FAIL\n'; grep -E '\[E\]|Error:|RenderFlex|overflowed|Expected:|Actual:|Which:|布局/渲染异常' /tmp/layout.log | head -n 20; } > ../docs/LAYOUT_PROOF.txt
          fi
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAYOUT_PROOF.txt
          git commit -m "test: record responsive layout proof"
          git push origin HEAD:main
          exit "$status"
