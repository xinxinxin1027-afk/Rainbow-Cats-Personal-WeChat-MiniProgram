name: Patch Member Dialog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-member-dialog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Keep member mutations outside the dialog transition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/lib/src/settings_pages.dart')
          text = path.read_text(encoding='utf-8')
          start = text.index('  Future<_MemberFormValue?> _memberDialog')
          marker = '\n  }\n}\n\nclass PointLedgerPage'
          end = text.index(marker, start) + len('\n  }')
          replacement = r'''  Future<_MemberFormValue?> _memberDialog(Member? member) async {
            final TextEditingController nameController = TextEditingController(
              text: member?.name ?? '',
            );
            final TextEditingController creditController = TextEditingController(
              text: '${member?.credit ?? 0}',
            );
            final GlobalKey<FormState> formKey = GlobalKey<FormState>();
            final DialogRoute<_MemberFormValue> route = DialogRoute<_MemberFormValue>(
              context: context,
              builder: (BuildContext context) {
                return AlertDialog(
                  title: Text(member == null ? '添加成员' : '编辑成员'),
                  content: Form(
                    key: formKey,
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: <Widget>[
                        TextFormField(
                          key: const ValueKey<String>('member-name'),
                          controller: nameController,
                          autofocus: true,
                          maxLength: 16,
                          decoration: const InputDecoration(labelText: '昵称'),
                          validator: (String? value) =>
                              (value ?? '').trim().isEmpty ? '请输入昵称' : null,
                        ),
                        TextFormField(
                          controller: creditController,
                          keyboardType: TextInputType.number,
                          decoration: const InputDecoration(labelText: '初始/当前积分'),
                          validator: (String? value) => int.tryParse(value ?? '') == null
                              ? '请输入整数'
                              : null,
                        ),
                      ],
                    ),
                  ),
                  actions: <Widget>[
                    TextButton(
                      onPressed: () => Navigator.pop(context),
                      child: const Text('取消'),
                    ),
                    FilledButton(
                      onPressed: () {
                        if (!(formKey.currentState?.validate() ?? false)) {
                          return;
                        }
                        Navigator.pop(
                          context,
                          _MemberFormValue(
                            nameController.text.trim(),
                            int.parse(creditController.text),
                          ),
                        );
                      },
                      child: const Text('保存'),
                    ),
                  ],
                );
              },
            );
            final _MemberFormValue? value = await Navigator.of(context).push(route);
            // DialogRoute.completed only finishes after its exit transition and overlay
            // entries are gone. Global store mutations therefore happen in a stable
            // Navigator build scope instead of racing the dialog dismissal.
            await route.completed;
            nameController.dispose();
            creditController.dispose();
            return value;
          }'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          git diff --check -- app/lib/src/settings_pages.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/src/settings_pages.dart
          git commit -m "fix: wait for member dialog transition before store mutation"
          git push origin HEAD:main
