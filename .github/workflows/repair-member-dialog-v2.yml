name: Repair Member Dialog V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-member-dialog-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 app/tool/repair_member_dialog.py
      - run: git diff --check -- app/lib/src/settings_pages.dart
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/src/settings_pages.dart
          git commit -m "fix: wait for member dialog route completion before store mutation"
          git push origin HEAD:main
