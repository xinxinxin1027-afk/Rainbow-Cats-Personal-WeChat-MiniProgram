name: Trigger Final V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-final-v2.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch latest main through Android Delivery V2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-delivery-v2.yml --repo "$GITHUB_REPOSITORY"

