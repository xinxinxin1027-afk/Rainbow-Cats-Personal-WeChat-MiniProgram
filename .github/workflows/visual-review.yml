name: Android Visual Review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/lib/**'
      - 'app/assets/**'
      - 'app/test/**'
      - 'app/tool/**'
      - 'miniprogram/**'
      - '.github/workflows/visual-review.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: python3 tool/static_source_check.py
      - run: python3 tool/test_tooling.py
      - run: bash tool/bootstrap_android.sh
      - name: 生成 11 页基线与交互状态截图
        run: |
          rm -rf visual_review/goldens visual_review/interactions
          mkdir -p visual_review/goldens visual_review/interactions
          flutter test --update-goldens test/visual_review_test.dart
          flutter test --update-goldens test/interaction_visual_test.dart
      - run: python3 -m pip install --disable-pip-version-check pillow
      - name: 视觉识别与截图数量门禁
        run: |
          count=$(find visual_review/goldens visual_review/interactions -type f -name '*.png' | wc -l)
          test "$count" -ge 20
          test "$count" -lt 100
          echo "$count" > visual_review/SCREENSHOT_COUNT.txt
          python3 tool/inspect_ui_gallery.py
          python3 tool/build_static_visual_review.py
      - uses: actions/upload-artifact@v7
        with:
          name: visual-review-liquid-glass-${{ github.sha }}
          path: app/visual_review
          if-no-files-found: error
          retention-days: 30

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: python3 tool/static_source_check.py
      - run: bash tool/bootstrap_android.sh
      - run: python3 -m pip install --disable-pip-version-check pillow
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .
      - uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd app && bash tool/run_android_visual_review.sh
      - uses: actions/upload-artifact@v7
        with:
          name: visual-review-emulator-${{ github.sha }}
          path: app/visual_review/emulator
          if-no-files-found: error
          retention-days: 30
